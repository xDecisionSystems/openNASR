# Shared tool settings for the whole repository. The projects themselves are built
# from core/, contract/, archiver/ and api/ (each has its own pyproject.toml).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", ".", "contract", "archiver", "api"]
# Keep temp directories only for failed tests. By default pytest keeps three runs of
# every test directory (about 2 GB each here), which filled the 8 GB /tmp RAM disk.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
