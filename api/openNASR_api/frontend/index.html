<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Explore FAA NASR airports, airspace, flight routes, arrivals, and departures.">
  <title>openNASR | Flight Data Explorer</title>
  <link rel="stylesheet" href="/ui/explorer.css">
  <script src="/ui/explorer.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/" aria-label="openNASR home"><span class="brand-mark" aria-hidden="true">✦</span>open<span>NASR</span></a>
      <div class="topbar-actions">
        <label class="cycle-label">FAA cycle <select id="cycle"><option value="">In effect</option></select></label>
        <details class="key-menu">
          <summary>API key</summary>
          <div class="key-panel">
            <label for="api-key">API key for this page</label>
            <input id="api-key" type="password" autocomplete="off" spellcheck="false">
            <button id="apply-key" type="button">Apply</button>
          </div>
        </details>
        <a class="docs-link" href="/docs">API docs <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <h1>Flight data explorer</h1>
      <p>Query the FAA National Airspace System by cycle.</p>
    </div>

    <div class="tabs" role="tablist" aria-label="Data type">
      <button type="button" role="tab" id="tab-airports" aria-controls="query-panel" aria-selected="true" data-tab="airports">Airports</button>
      <button type="button" role="tab" id="tab-airspace" aria-controls="query-panel" aria-selected="false" tabindex="-1" data-tab="airspace">Airspace</button>
      <button type="button" role="tab" id="tab-flightplan" aria-controls="query-panel" aria-selected="false" tabindex="-1" data-tab="flightplan">Flight Plan</button>
      <button type="button" role="tab" id="tab-routes" aria-controls="query-panel" aria-selected="false" tabindex="-1" data-tab="routes">Routes</button>
      <button type="button" role="tab" id="tab-arrivals" aria-controls="query-panel" aria-selected="false" tabindex="-1" data-tab="arrivals">Arrivals</button>
      <button type="button" role="tab" id="tab-departures" aria-controls="query-panel" aria-selected="false" tabindex="-1" data-tab="departures">Departures</button>
    </div>

    <section class="workspace" id="query-panel" role="tabpanel" aria-labelledby="tab-airports">
      <section class="card query-card" aria-labelledby="query-title">
        <h2 id="query-title">Find an airport</h2>
        <p id="query-help"></p>
        <form id="query-form">
          <div id="fields"></div>
          <button class="primary" id="submit" type="submit">Search</button>
        </form>
        <button class="example" id="example" type="button"></button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>

      <section class="card plot-card" aria-labelledby="plot-title">
        <div class="plot-header">
          <h2 id="plot-title">Coordinate plot</h2>
          <span id="plot-note">WGS 84</span>
        </div>
        <div class="plot">
          <canvas id="plot" role="img" aria-label="Latitude and longitude grid"></canvas>
          <div id="zoom-box" hidden></div>
          <div class="zoom-controls" aria-label="Plot zoom">
            <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
            <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
            <button type="button" id="zoom-area" aria-pressed="false">Zoom area</button>
            <button type="button" id="zoom-reset" aria-label="Fit plot">Fit</button>
          </div>
          <p class="plot-caption" id="plot-caption">Query an airport to plot its runways, helipads, and ILS localizers.</p>
        </div>
        <div id="airport-procedure-layers" class="plot-legend airspace-layers" role="group" aria-label="Airport map layers" hidden></div>
        <div id="plot-legend" class="plot-legend" aria-label="Visible procedure branches" hidden></div>
        <div id="airspace-layers" class="plot-legend airspace-layers" role="group" aria-label="Airspace map layers" hidden></div>
      </section>
    </section>

    <section class="card results" aria-labelledby="results-title">
      <div class="results-header"><h2 id="results-title">Results</h2><span id="result-cycle"></span></div>
      <div id="results"><p class="empty">Results will appear here after a query.</p></div>
    </section>
    <footer>openNASR <span>FAA NASR subscription data</span></footer>
  </main>
</body>
</html>
