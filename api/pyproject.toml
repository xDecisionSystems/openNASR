[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openNASR-api"
version = "0.1.0"
description = "Read-only HTTP API for openNASR: resolve flight-plan routes to lat/lon"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "openNASR>=2.0",
  "openNASR-contract[s3]>=0.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
openNASR-api = "openNASR_api.cli:main"

[tool.setuptools]
packages = ["openNASR_api"]
