[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openNASR-contract"
version = "0.2.0"
description = "Bucket key layout and manifest shared by the openNASR archiver and API"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[tool.setuptools]
packages = ["openNASR_contract"]
