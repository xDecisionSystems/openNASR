name: Signed deployment release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: python -m pip install "./core[dev,plot,release]"
      - run: python -m pytest
        if: github.ref_type == 'tag'
      - name: Build deployment assets
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("core/pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Expected release tag v{version}")
          PY
          for package in core contract archiver api; do
            python -m build --wheel --outdir "$PWD/dist" "$package"
          done
          python -m twine check dist/*
          cd dist
          core=(opennasr-*.whl)
          contract=(opennasr_contract-*.whl)
          for role in api archiver; do
            service=(opennasr_"${role}"-*.whl)
            extra=""
            if [ "$role" = archiver ]; then extra="[s3]"; fi
            printf '%s\n' \
              "openNASR @ file://$PWD/${core[0]}" \
              "openNASR-contract[s3] @ file://$PWD/${contract[0]}" \
              "openNASR-${role}${extra} @ file://$PWD/${service[0]}" |
              uv pip compile - --universal --python-version 3.10 \
                --generate-hashes --only-binary :all: --no-header --no-annotate \
                --no-emit-package openNASR --no-emit-package openNASR-contract \
                --no-emit-package "openNASR-$role" --no-emit-package duckdb \
                --output-file "$role-dependencies.txt" > /dev/null
          done
          cd ..
          cp deploy/opennasr-update dist/
          python - <<'PY'
          import hashlib
          import json
          import os
          import tomllib
          from pathlib import Path

          dist = Path("dist")
          assets = {}
          for path in sorted(dist.iterdir()):
              with path.open("rb") as asset:
                  assets[path.name] = hashlib.file_digest(asset, "sha256").hexdigest()
          version = tomllib.loads(Path("core/pyproject.toml").read_text())["project"]["version"]
          manifest = {
              "schema": 2,
              "version": f"v{version}",
              "commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "assets": assets,
          }
          (dist / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Verify locked installs on the guest Python version
        run: |
          set -euo pipefail
          cd dist
          for role in api archiver; do
            venv="$RUNNER_TEMP/opennasr-$role"
            uv venv --python 3.13 --seed "$venv"
            "$venv/bin/python" -m pip install --no-deps --only-binary=:all: \
              --require-hashes -r "$role-dependencies.txt"
            "$venv/bin/python" -m pip install --no-deps --only-binary=:all: \
              'duckdb==1.5.6' opennasr-*.whl opennasr_contract-*.whl opennasr_"${role}"-*.whl
            "$venv/bin/python" -m pip check
            "$venv/bin/python" -c "import boto3, duckdb; assert duckdb.sql('SELECT 1').fetchone() == (1,)"
            "$venv/bin/openNASR-$role" --help
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-assets
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deployment-assets
          path: dist/
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Sign and verify the manifest
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/manifest.json.sigstore.json dist/manifest.json
          cosign verify-blob --bundle dist/manifest.json.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/manifest.json
      - name: Publish deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # This job has no checkout, so gh must be told the repository explicitly.
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
