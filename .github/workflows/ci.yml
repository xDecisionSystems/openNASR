name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff format --check openNASR tests
      - run: ruff check openNASR tests
      - run: mypy openNASR
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          wheel = next(Path('dist').glob('*.whl')); forbidden = [name for name
          in ZipFile(wheel).namelist() if name.startswith('openNASR/data/')];
          assert not forbidden, forbidden"
      - run: python -m pip install twine
      - run: python -m twine check dist/*
