name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,plot,duckdb]"
      - run: python -m pytest

  package:
    name: Static checks and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,release]"
      - run: ruff format --check openNASR tests benchmarks tools
      - run: ruff check openNASR tests benchmarks tools
      - run: mypy openNASR
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Reject bundled FAA data
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              wheel_files = archive.namelist()
          with open_tar(sdist, "r:gz") as archive:
              sdist_files = archive.getnames()
          forbidden = [
              name
              for name in [*wheel_files, *sdist_files]
              if "/openNASR/data/" in f"/{name}"
          ]
          assert not forbidden, forbidden
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
